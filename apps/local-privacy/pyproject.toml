[project]
name = "handover-local-privacy"
version = "0.1.0"
description = "Loopback-only local transcription and clinical de-identification service"
requires-python = ">=3.10,<3.13"
dependencies = [
    "anyio==4.13.0",
    "fastapi==0.135.3",
    "pydantic==2.12.5",
    "uvicorn[standard]==0.43.0",
]

[project.optional-dependencies]
mlx = [
    "omi-med-stt[mlx]==0.1.21",
    "openmed[mlx]==2.2.0",
]
nvidia = [
    "omi-med-stt[nemo]==0.1.21",
    "openmed[hf]==2.2.0",
]
cpu = [
    "omi-med-stt[cpp]==0.1.21",
    "openmed[hf]==2.2.0",
]
test = [
    "httpx==0.28.1",
]

[project.scripts]
handover-local-privacy = "local_privacy.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["local_privacy"]
